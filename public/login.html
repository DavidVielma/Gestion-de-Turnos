<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gestión de Turnos</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">📅</div>
                <h1>Gestión de Turnos</h1>
                <p>Ingresa tus credenciales para continuar</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required placeholder="Tu nombre de usuario">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="Tu contraseña">
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    <span>Iniciar Sesión</span>
                </button>
            </form>

            <div class="login-divider">
                <span>¿No tienes cuenta?</span>
            </div>

            <form id="registerForm" class="register-form hidden">
                <div class="form-group">
                    <label for="regUsername">Usuario</label>
                    <input type="text" id="regUsername" name="username" required
                        placeholder="Elige un nombre de usuario">
                </div>

                <div class="form-group">
                    <label for="regPassword">Contraseña</label>
                    <input type="password" id="regPassword" name="password" required placeholder="Mínimo 4 caracteres">
                </div>

                <button type="submit" class="btn btn-success btn-full">
                    <span>Crear Cuenta</span>
                </button>
            </form>

            <button id="toggleForm" class="btn btn-outline btn-full toggle-btn">
                Regístrate
            </button>

            <div id="message" class="message hidden"></div>
        </div>

        <div class="login-footer">
            <p>Sistema de Gestión de Turnos © 2026</p>
            <p style="margin-top: 4px; font-size: 11px;">Creado con amor por David Vielma ❤️</p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
