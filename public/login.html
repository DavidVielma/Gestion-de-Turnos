<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Turnos · Iniciar sesión</title>
    <meta name="description" content="Registra tus turnos y calcula tus honorarios. Hecho para personal de salud.">
    <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0c0c" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Turnos">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme_mode');
                if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
    <link rel="stylesheet" href="/css/styles.css?v=3.1.4">
</head>

<body class="auth-page">
    <main class="auth">
        <div class="auth-brand">
            <img src="/icons/icon.svg" alt="" width="56" height="56">
            <h1>Turnos</h1>
            <p>Tus turnos y honorarios, claros.<br>Para matronas, enfermeras, TENS, médicos y todo el equipo de salud.</p>
        </div>

        <div class="card auth-card">
            <div class="segmented" role="tablist">
                <button class="active" data-mode="login" role="tab">Ingresar</button>
                <button data-mode="register" role="tab">Crear cuenta</button>
            </div>

            <form id="authForm" novalidate>
                <label class="field">
                    <span>Usuario</span>
                    <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </label>
                <label class="field">
                    <span>Contraseña</span>
                    <input type="password" id="password" autocomplete="current-password" required>
                </label>
                <div id="message" class="message hidden"></div>
                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Ingresar</button>
            </form>
        </div>

        <p class="footnote">© 2026 · Hecho con cariño por David Vielma</p>
    </main>

    <script src="/js/auth.js?v=3.1.4"></script>
</body>

</html>
